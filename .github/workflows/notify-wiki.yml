name: Notify Wiki

# Tells LeagueToolkit/lol-meta-wiki that db/meta.db.json moved so it can pull and
# redeploy right away. Without this the wiki only learns via its own weekly cron
# (Sun 06:00 UTC), so a mid-week sync sits unpublished for up to six days.
#
# `push` is the entry point that matters: every db/ change now arrives by a PR
# merging into main, whether that is the sync bot's own PR (merged under an app
# token, which does raise `push` events - GITHUB_TOKEN would not) or a human
# merging something like a hashtable name-snapshot refresh, which rewrites names
# across the database without any dump changing.
#
# `workflow_call` is kept as an escape hatch for a caller that needs to dispatch
# explicitly. The sync workflow no longer uses it: it would double-fire against
# the `push` above.

on:
  push:
    branches: [main]
    paths:
      - 'db/meta.db.json'

  workflow_call:
    secrets:
      WIKI_DISPATCH_TOKEN:
        required: true

  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch meta-db-updated
        env:
          GH_TOKEN: ${{ secrets.WIKI_DISPATCH_TOKEN }}
        run: |
          set -e
          gh api repos/LeagueToolkit/lol-meta-wiki/dispatches \
            --input - <<EOF
          {
            "event_type": "meta-db-updated",
            "client_payload": {
              "sha": "${{ github.sha }}",
              "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          }
          EOF
          echo "Dispatched meta-db-updated to lol-meta-wiki."
