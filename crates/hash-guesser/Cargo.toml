[package]
name = "hash-guesser"
version = "0.1.0"
edition = "2021"
description = "Guesses names for unresolved bin hashes by recombining words from names we already know"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
rayon = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
