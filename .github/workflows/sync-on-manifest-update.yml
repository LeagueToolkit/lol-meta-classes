name: Sync LoL Meta Classes

# Discovers new game builds, dumps them, rebuilds db/, and opens a PR.
#
# It opens a PR rather than pushing: main is protected and requires the `verify`
# check, and a required check can never be satisfied by a direct push - it has to
# be green on the commit before that commit is allowed to land.
#
# Setup this depends on:
#   - secrets SYNC_APP_ID / SYNC_APP_PRIVATE_KEY, for a GitHub App installed on
#     this repo with `contents: write` and `pull-requests: write`. It must be a
#     an app (or a PAT) rather than GITHUB_TOKEN, whose actions raise no workflow
#     events - a PR it opened would never trigger `verify` and could never merge.
#   - "Allow auto-merge" enabled on the repo, so the PR lands unattended once
#     `verify` passes. Without it the PR is still opened, with a warning.

on:
  # Trigger when riot-manifests repository updates
  repository_dispatch:
    types: [manifest-updated]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if no changes detected'
        required: false
        default: 'false'

  # Fallback: weekly, Sunday 00:00 UTC
  schedule:
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always
  # Ensure warnings don't cause build failures and include export-dynamic for dumper
  RUSTFLAGS: "-A warnings -C link-args=-Wl,-export-dynamic"

jobs:
  sync:
    runs-on: ubuntu-latest
    # For GITHUB_TOKEN, which still creates the release. The git push and the PR
    # go through the app token instead.
    permissions:
      contents: write

    steps:
    - name: Mint an app token
      id: app_token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.SYNC_APP_ID }}
        private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ steps.app_token.outputs.token }}
        persist-credentials: true

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y libc++1 build-essential cmake

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: x86_64-unknown-linux-gnu

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build dumper
      run: |
        cargo build --release --bin dumper --target x86_64-unknown-linux-gnu

    # meta-sync exits non-zero if any individual version failed. That must not stop
    # the job here: versions that succeeded are already on disk and still need to be
    # committed and released. The outcome is re-raised in the final step instead.
    - name: Run meta-sync
      id: meta_sync
      continue-on-error: true
      run: |
        cargo run --release --bin meta-sync
      env:
        RUST_LOG: info
        DUMPER_PATH: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/dumper

    - name: Detect new dumps
      id: changes
      run: |
        # Detect new untracked dump files
        NEW_DUMPS=$(git ls-files --others --exclude-standard -- 'dumps/*.json')
        # Detect modified dump files
        MODIFIED_DUMPS=$(git diff --name-only -- 'dumps/*.json')

        ALL_CHANGED=$(echo -e "${NEW_DUMPS}\n${MODIFIED_DUMPS}" | grep -v '^$' | sort -u)

        if [ -z "$ALL_CHANGED" ]; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No new or modified dumps detected."
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changed dumps:"
          echo "$ALL_CHANGED"

          # Extract version from the latest changed dump
          LATEST_VERSION=$(echo "$ALL_CHANGED" \
            | grep -E '^dumps/[0-9]+\.[0-9]+\.[0-9]+\.json$' \
            | sed -E 's#^dumps/([0-9]+\.[0-9]+\.[0-9]+)\.json$#\1#' \
            | sort -V \
            | tail -1)
          echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT

          # Save list of changed files for release upload
          echo "$ALL_CHANGED" > /tmp/changed_dumps.txt
        fi

    - name: Validate dump sizes
      if: steps.changes.outputs.changes == 'true'
      run: |
        set -e
        MAX_SIZE_MB=50
        while IFS= read -r file; do
          SIZE_BYTES=$(stat --format=%s "$file")
          SIZE_MB=$((SIZE_BYTES / 1048576))
          echo "$file: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt "$MAX_SIZE_MB" ]; then
            echo "ERROR: $file is ${SIZE_MB}MB, exceeding ${MAX_SIZE_MB}MB limit. Dump is likely corrupted."
            exit 1
          fi
        done < /tmp/changed_dumps.txt
        echo "All dumps are within size limits."

    - name: Create GitHub Release with dumps
      if: steps.changes.outputs.changes == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        VERSION="${{ steps.changes.outputs.latest_version }}"
        TAG="v${VERSION}"

        # Check if release already exists
        if gh release view "$TAG" &>/dev/null; then
          echo "Release $TAG already exists, updating assets..."
          while IFS= read -r file; do
            BASENAME=$(basename "$file")
            # Delete existing asset if present, then upload new one
            gh release delete-asset "$TAG" "$BASENAME" --yes 2>/dev/null || true
            gh release upload "$TAG" "$file"
          done < /tmp/changed_dumps.txt
        else
          echo "Creating release $TAG..."
          ASSET_ARGS=""
          while IFS= read -r file; do
            ASSET_ARGS="$ASSET_ARGS $file"
          done < /tmp/changed_dumps.txt

          gh release create "$TAG" \
            --title "LoL Meta Classes ${VERSION}" \
            --notes "Meta class dumps for League of Legends version ${VERSION}" \
            $ASSET_ARGS
        fi

    - name: Rebuild database from all dumps
      if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_run == 'true'
      run: |
        set -e
        if [ ! -d "dumps" ] || [ -z "$(ls -1 dumps/*.json 2>/dev/null || true)" ]; then
          echo "No dumps found, skipping database regeneration."
          exit 0
        fi

        # Rebuilds db/meta.db.json (versioned history of every class/property)
        # and db/database.py (snapshot of the latest build) from all dumps.
        python3 scripts/db_build.py

    - name: Open a pull request with the dump and database updates
      id: commit
      if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_run == 'true'
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
      run: |
        set -e
        git config --local user.email "${{ steps.app_token.outputs.app-slug }}[bot]@users.noreply.github.com"
        git config --local user.name "${{ steps.app_token.outputs.app-slug }}[bot]"

        # Stage dump files and database
        git add dumps/
        git add db/database.py db/meta.db.json

        # Check if there's anything to commit
        if git diff --cached --quiet; then
          echo "No changes to commit."
          echo "db_changed=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Only the database file is what downstream consumes, so report on that
        # specifically - a dumps-only change gives the wiki nothing to redeploy.
        if git diff --cached --quiet -- db/meta.db.json; then
          DB_CHANGED=false
        else
          DB_CHANGED=true
        fi
        echo "db_changed=${DB_CHANGED}" >> $GITHUB_OUTPUT

        VERSION="${{ steps.changes.outputs.latest_version }}"
        if [ -n "$VERSION" ]; then
          COMMIT_MSG="chore(dumper): ${VERSION}"
          BRANCH="sync/${VERSION}-${{ github.run_id }}"
        else
          COMMIT_MSG="Update LoL meta classes"
          BRANCH="sync/update-${{ github.run_id }}"
        fi

        git checkout -b "$BRANCH"
        git commit -m "$COMMIT_MSG"
        git push origin "$BRANCH"
        echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

        CHANGED=$(cat /tmp/changed_dumps.txt 2>/dev/null | sed 's/^/- `/;s/$/`/' || echo "- (none)")
        PR_URL=$(gh pr create \
          --base main \
          --head "$BRANCH" \
          --title "$COMMIT_MSG" \
          --body "$(cat <<EOF
        Automated sync from [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

        Dumps added or changed:
        ${CHANGED}

        \`db/meta.db.json\` changed: \`${DB_CHANGED}\`
        EOF
        )")
        echo "Opened ${PR_URL}"
        echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT

        # Queue it behind the required checks. Needs "Allow auto-merge" enabled
        # on the repo; without it this is a warning rather than a failed sync,
        # since the PR itself is the deliverable.
        if ! gh pr merge --auto --squash --delete-branch "$PR_URL"; then
          echo "::warning title=auto-merge::Could not enable auto-merge - merge ${PR_URL} manually."
        fi

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lol-meta-dumps-${{ github.run_id }}
        path: |
          dumps/
        retention-days: 30

    # Runs last so everything above (release, db rebuild, commit, push, artifacts)
    # still happens for the versions that did succeed.
    - name: Report version failures
      if: always() && steps.meta_sync.outcome == 'failure'
      run: |
        echo "::error title=meta-sync::One or more versions failed to process - see the 'Run meta-sync' step log for the per-version reason."
        exit 1

  # notify-wiki is deliberately NOT called from here any more.
  #
  # It used to be, because a GITHUB_TOKEN push raises no `push` event and its own
  # trigger would never have seen the sync. The sync no longer pushes to main at
  # all - it opens a PR that merges under an app token, and that merge does raise
  # a `push` event. notify-wiki.yml picks it up itself, on the real db/ change
  # rather than in anticipation of one. Calling it here as well would double-fire.
