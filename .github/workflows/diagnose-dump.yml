# Runs the dumper against a single version with crash diagnostics enabled and
# reports what faulted. Purely investigative: it commits nothing and touches no
# tracked file, so it is safe to run repeatedly while chasing a crash.
name: Diagnose Dump

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to take the build from'
        required: true
        type: choice
        default: PBE1
        options:
          - PBE1
          - EUW1
          - NA1
          - KR
          - BR1
          - EUN1
          - JP1
          - LA1
          - LA2
          - ME1
          - OC1
          - PH2
          - RU
          - SG2
          - TH2
          - TR1
          - TW2
          - VN2
          - STAGING
      version:
        description: 'Version to diagnose (e.g. 16.17.8087655). Empty = newest for the region.'
        required: false
        type: string
        default: ''
      poison:
        description: 'Poison unresolved imports (identifies missing stubs by name)'
        required: false
        type: boolean
        default: true
      tolerate:
        description: 'Continue past broken records instead of panicking (shows how many there are)'
        required: false
        type: boolean
        default: false
      dump_class:
        description: 'Hexdump one class and its property records, by hash (e.g. fa33b8e8)'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-A warnings -C link-args=-Wl,-export-dynamic"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y libc++1 build-essential cmake

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: x86_64-unknown-linux-gnu

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    # Covers the poison encode/decode arithmetic the fault report depends on.
    # If this is wrong, a crash gets blamed on the wrong symbol.
    - name: Test dumper diagnostics
      run: |
        cargo test -p dumper --target x86_64-unknown-linux-gnu

    # Debug info in the release build so a gdb backtrace names functions and
    # lines. Diagnostic-only; the sync workflow builds without it. The downloader
    # is built alongside so the release profile is compiled once.
    - name: Build dumper and downloader
      env:
        CARGO_PROFILE_RELEASE_DEBUG: "true"
      run: |
        cargo build --release --target x86_64-unknown-linux-gnu \
          --bin dumper --bin download-binary

    - name: Resolve version
      id: resolve
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REGION: ${{ inputs.region }}
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        set -euo pipefail
        BIN=./target/x86_64-unknown-linux-gnu/release/download-binary
        if [ -z "$VERSION_INPUT" ]; then
          VERSION=$("$BIN" --region "$REGION" --resolve --latest)
        else
          VERSION=$("$BIN" --region "$REGION" --resolve "$VERSION_INPUT")
        fi
        echo "Resolved ${REGION} -> ${VERSION}"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Download binary
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REGION: ${{ inputs.region }}
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        ./target/x86_64-unknown-linux-gnu/release/download-binary \
          --region "$REGION" "$VERSION" -o "temp/$VERSION"

    - name: Run dumper with diagnostics
      id: run
      env:
        DUMPER_POISON_IMPORTS: ${{ inputs.poison && '1' || '0' }}
        DUMPER_TOLERATE_ANOMALIES: ${{ inputs.tolerate && '1' || '0' }}
        DUMPER_DUMP_CLASS: ${{ inputs.dump_class }}
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        mkdir -p dumps
        set +e
        ./target/x86_64-unknown-linux-gnu/release/dumper \
          "temp/$VERSION" \
          -o "dumps/$VERSION.json" 2>&1 | tee /tmp/dumper.log
        CODE=${PIPESTATUS[0]}
        set -e
        echo "exit_code=${CODE}" >> $GITHUB_OUTPUT
        echo "Dumper exit code: ${CODE}"

    # Only for hardware faults. A Rust panic already unwinds with a backtrace,
    # and gdb would just show the panic machinery.
    - name: Backtrace under gdb
      if: always() && steps.run.outputs.exit_code == '139'
      env:
        DUMPER_POISON_IMPORTS: ${{ inputs.poison && '1' || '0' }}
        DUMPER_TOLERATE_ANOMALIES: ${{ inputs.tolerate && '1' || '0' }}
        DUMPER_DUMP_CLASS: ${{ inputs.dump_class }}
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        sudo apt-get install -y gdb
        # gdb intercepts the fault before our handler, so this is the real
        # stop point rather than the handler's frame.
        gdb --batch \
          -ex 'run' \
          -ex 'echo \n=== BACKTRACE ===\n' \
          -ex 'bt 40' \
          -ex 'echo \n=== REGISTERS ===\n' \
          -ex 'info registers' \
          -ex 'echo \n=== FAULTING INSN ===\n' \
          -ex 'x/4i $pc' \
          --args ./target/x86_64-unknown-linux-gnu/release/dumper \
            "temp/$VERSION" \
            -o "dumps/$VERSION.json" \
          2>&1 | tail -120 | tee /tmp/gdb.log

    - name: Summarise diagnosis
      if: always()
      env:
        REGION: ${{ inputs.region }}
        VERSION_INPUT: ${{ inputs.version }}
        VERSION: ${{ steps.resolve.outputs.version }}
        POISON: ${{ inputs.poison }}
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
      run: |
        {
          echo "## Diagnosis: ${REGION} ${VERSION}"
          echo ""
          echo "- Region: \`${REGION}\`"
          echo "- Requested: \`${VERSION_INPUT:-latest}\`"
          echo "- Resolved: \`${VERSION}\`"
          echo "- Poisoning: \`${POISON}\`"
          echo "- Dumper exit code: \`${EXIT_CODE}\`"
          echo ""
          if grep -q '!!! FAULT' /tmp/dumper.log 2>/dev/null; then
            echo "### Fault report"
            echo '```'
            grep -A 6 '!!! FAULT' /tmp/dumper.log
            echo '```'
          elif [ "${EXIT_CODE}" = "0" ]; then
            echo "### No fault - dump completed"
            ls -la "dumps/${VERSION}.json" 2>/dev/null || true
          else
            echo "### Failed without a fault report"
            echo '```'
            tail -30 /tmp/dumper.log 2>/dev/null || echo "(no log)"
            echo '```'
          fi
          echo ""
          echo "### Import resolution"
          echo '```'
          grep -E 'Resolved [0-9]+/|Poisoned |First unresolved' /tmp/dumper.log 2>/dev/null || echo "(not reached)"
          echo '```'
          if [ -s /tmp/gdb.log ]; then
            echo ""
            echo "### gdb backtrace"
            echo '```'
            sed -n '/=== BACKTRACE ===/,$p' /tmp/gdb.log | head -50
            echo '```'
          fi
          if grep -q 'panicked at\|ANOMALY' /tmp/dumper.log 2>/dev/null; then
            echo ""
            echo "### Panic / anomalies"
            echo "Distinct anomalies: \`$(grep -c '^ANOMALY' /tmp/dumper.log 2>/dev/null || echo 0)\` printed"
            echo '```'
            grep -E 'panicked at|^ANOMALY|anomal(y|ies) (was|were) tolerated|Property stride' /tmp/dumper.log \
              | head -40
            echo '```'
          fi
        } >> $GITHUB_STEP_SUMMARY

    - name: Upload logs and dump
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: diagnose-${{ inputs.region }}-${{ steps.resolve.outputs.version }}-${{ github.run_id }}
        path: |
          /tmp/dumper.log
          /tmp/gdb.log
          dumps/${{ steps.resolve.outputs.version }}.json
        retention-days: 14
        if-no-files-found: warn

    - name: Fail if the dumper crashed
      if: always() && steps.run.outputs.exit_code != '0'
      run: |
        echo "::error::Dumper exited ${{ steps.run.outputs.exit_code }} - see the job summary for the fault report."
        exit 1
